definitions:
  internal_transport_handlers.LoginModel:
    properties:
      login:
        type: string
      password:
        type: string
    type: object
  internal_transport_handlers.RegisterCustomerModel:
    properties:
      address:
        $ref: '#/definitions/internal_transport_handlers.customerAddressRest'
      birth_date:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: integer
      last_name:
        type: string
      login:
        type: string
      password:
        type: string
      phone:
        type: string
    type: object
  internal_transport_handlers.UpdateAddressModel:
    properties:
      city:
        type: string
      country:
        type: string
      customer_id:
        type: integer
      id:
        type: integer
      is_primary:
        type: boolean
      street:
        type: string
      zip_code:
        type: string
    type: object
  internal_transport_handlers.UpdateCredsModel:
    properties:
      login:
        type: string
      password:
        type: string
    type: object
  internal_transport_handlers.customerAddressRest:
    properties:
      city:
        type: string
      country:
        type: string
      customer_id:
        type: integer
      is_primary:
        type: boolean
      street:
        type: string
      zip_code:
        type: string
    type: object
  internal_transport_handlers.customerRest:
    properties:
      email:
        type: string
      firstName:
        type: string
      id:
        type: integer
      last_name:
        type: string
      phone:
        type: string
    type: object
  orch-go_internal_domain_account.Account:
    properties:
      balance:
        type: number
      created_at:
        type: string
      customer_id:
        type: integer
      iban:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      type_id:
        type: integer
    type: object
  orch-go_internal_domain_atm.Atm:
    properties:
      atmID:
        format: int32
        type: integer
      branchID:
        format: int32
        type: integer
      location:
        type: string
      status:
        type: string
    type: object
  orch-go_internal_domain_branch.Branch:
    properties:
      address:
        type: string
      branchID:
        format: int32
        type: integer
      city:
        type: string
      name:
        type: string
      phone:
        type: string
