syntax = "proto3";

package protos;
option go_package = "orch-go/gen/protos;protos";
option csharp_namespace = "Core";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "customer.proto";
import "custom_types.proto";

// Service managing user credentials (logins, passwords) for customer portal authentication.
service UserCredentialService {
  // Retrieves a paginated list of all user credentials.
  rpc GetAll (GetAllRequest) returns (GetAllUserCredentialsResponse);
  // Retrieves a specific user credential record by customer ID.
  rpc GetById (GetUserCredentialByIdRequest) returns (UserCredentialModel);
  // Retrieves multiple user credential records by their customer IDs.
  rpc GetByIds (GetUserCredentialByIdsRequest) returns (GetAllUserCredentialsResponse);
  // Retrieves a user credential record by its unique username.
  rpc GetByUsername (GetUserCredentialByUsernameRequest) returns (UserCredentialModel);
  // Creates a new user credential record.
  rpc Add (AddUserCredentialRequest) returns (UserCredentialModel);
  // Updates an existing user credential record (e.g. changing password or username).
  rpc Update (UpdateUserCredentialRequest) returns (google.protobuf.Empty);
  // Deletes a user credential record by customer ID.
  rpc Delete (DeleteUserCredentialRequest) returns (google.protobuf.Empty);
  // Bulk creates multiple new user credentials.
  rpc AddBulk (AddUserCredentialBulkRequest) returns (google.protobuf.Empty);
  // Bulk updates multiple user credentials.
  rpc UpdateBulk (UpdateUserCredentialBulkRequest) returns (google.protobuf.Empty);
  // Bulk deletes multiple user credentials.
  rpc DeleteBulk (DeleteUserCredentialBulkRequest) returns (google.protobuf.Empty);
  // Gets the total count of user credential records.
  rpc GetCount (google.protobuf.Empty) returns (CountResponse);
}

// Data model representing user security credentials.
message UserCredentialModel {
  // Unique customer ID who owns these credentials.
  int32 customer_id = 1;
  // Unique login username.
  string username = 2;
  // Hashed representation of the password.
  string password_hash = 3;
  // Optional timestamp of when the credentials were last updated.
  optional google.protobuf.Timestamp updated_at = 4;
}

// Response containing a list of user credentials.
message GetAllUserCredentialsResponse {
  // List of user credentials.
  repeated UserCredentialModel user_credentials = 1;
}

// Request to retrieve a user credential by customer ID.
message GetUserCredentialByIdRequest {
  // The customer ID.
  int32 customer_id = 1;
}

// Request to retrieve multiple user credentials by their customer IDs.
message GetUserCredentialByIdsRequest {
  // List of customer IDs.
  repeated int32 customer_ids = 1;
}

// Request to retrieve a user credential by username.
message GetUserCredentialByUsernameRequest {
  // The username.
  string username = 1;
}

// Request to add a new user credential record.
message AddUserCredentialRequest {
  // Customer ID to link these credentials to.
  int32 customer_id = 1;
  // The login username.
  string username = 2;
  // The hashed password.
  string password_hash = 3;
}

// Request to bulk add multiple new user credentials.
message AddUserCredentialBulkRequest {
  // List of new user credentials.
  repeated AddUserCredentialRequest user_credentials = 1;
}

// Request to update an existing user credential.
message UpdateUserCredentialRequest {
  // Customer ID.
  int32 customer_id = 1;
  // Updated login username.
  string username = 2;
  // Updated hashed password.
  string password_hash = 3;
}

// Request to bulk update user credentials.
message UpdateUserCredentialBulkRequest {
  // List of user credential updates.
  repeated UpdateUserCredentialRequest user_credentials = 1;
}

// Request to delete a user credential record.
message DeleteUserCredentialRequest {
  // The customer ID of the record to delete.
  int32 customer_id = 1;
}

// Request to bulk delete user credentials.
message DeleteUserCredentialBulkRequest {
  // List of deletion payloads.
  repeated DeleteUserCredentialRequest user_credentials = 1;
}
