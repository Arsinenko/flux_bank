syntax = "proto3";

package protos;
option go_package = "orch-go/gen/protos;protos";
option csharp_namespace = "Core";

import "custom_types.proto";
import "google/protobuf/empty.proto";

// Service managing physical bank branches.
service BranchService {
  // Retrieves a paginated list of all bank branches.
  rpc GetAll (GetAllRequest) returns (GetAllBranchesResponse);
  // Retrieves a specific branch by its unique ID.
  rpc GetById (GetBranchByIdRequest) returns (BranchModel);
  // Retrieves multiple branches by their unique IDs.
  rpc GetByIds (GetBranchByIdsRequest) returns (GetAllBranchesResponse);
  // Creates a new bank branch.
  rpc Add (AddBranchRequest) returns (BranchModel);
  // Updates details of an existing branch.
  rpc Update (UpdateBranchRequest) returns (google.protobuf.Empty);
  // Deletes a branch by its unique ID.
  rpc Delete (DeleteBranchRequest) returns (google.protobuf.Empty);
  // Bulk creates multiple new bank branches.
  rpc AddBulk (AddBranchBulkRequest) returns (google.protobuf.Empty);
  // Bulk updates multiple existing bank branches.
  rpc UpdateBulk (UpdateBranchBulkRequest) returns (google.protobuf.Empty);
  // Bulk deletes multiple bank branches.
  rpc DeleteBulk (DeleteBranchBulkRequest) returns (google.protobuf.Empty);
  // Gets the total count of bank branches.
  rpc GetCount (google.protobuf.Empty) returns (CountResponse);
}

// Data model representing a physical bank branch.
message BranchModel {
  // Unique identifier for the branch.
  int32 branch_id = 1;
  // Optional name of the branch.
  optional string name = 2;
  // Optional city where the branch is located.
  optional string city = 3;
  // Optional physical address details.
  optional string address = 4;
  // Optional telephone contact number for the branch.
  optional string phone = 5;
}

// Response containing a list of bank branches.
message GetAllBranchesResponse {
  // List of branches.
  repeated BranchModel branches = 1;
}

// Request to retrieve a branch by its unique ID.
message GetBranchByIdRequest {
  // The unique ID of the branch.
  int32 branch_id = 1;
}

// Request to retrieve multiple branches by their unique IDs.
message GetBranchByIdsRequest {
  // List of branch IDs.
  repeated int32 branch_ids = 1;
}

// Request to add a new bank branch.
message AddBranchRequest {
  // Optional name for the new branch.
  optional string name = 1;
  // Optional city for the new branch.
  optional string city = 2;
  // Optional address for the new branch.
  optional string address = 3;
  // Optional phone number for the new branch.
  optional string phone = 4;
}

// Request to update an existing bank branch.
message UpdateBranchRequest {
  // The unique ID of the branch to update.
  int32 branch_id = 1;
  // Optional updated name.
  optional string name = 2;
  // Optional updated city.
  optional string city = 3;
  // Optional updated address.
  optional string address = 4;
  // Optional updated phone number.
  optional string phone = 5;
}

// Request to delete a branch.
message DeleteBranchRequest {
  // The unique ID of the branch to delete.
  int32 branch_id = 1;
}

// Request to bulk add multiple new bank branches.
message AddBranchBulkRequest {
  // List of branches to add.
  repeated AddBranchRequest branches = 1;
}

// Request to bulk update multiple bank branches.
message UpdateBranchBulkRequest {
  // List of branch update payloads.
  repeated UpdateBranchRequest branches = 1;
}

// Request to bulk delete multiple bank branches.
message DeleteBranchBulkRequest {
  // List of branch deletion requests.
  repeated DeleteBranchRequest branches = 1;
}
