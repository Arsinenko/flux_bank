syntax = "proto3";

package protos;
option go_package = "orch-go/gen/protos;protos";
option csharp_namespace = "Core";

import "custom_types.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";
import "customer.proto";
import "account_type.proto";

// Service managing customer bank accounts.
service AccountService {
  // Retrieves a paginated list of accounts.
  rpc GetAll (GetAllRequest) returns (GetAllAccountsResponse);
  // Retrieves a specific account by its unique ID.
  rpc GetById (GetAccountByIdRequest) returns (AccountModel);
  // Retrieves multiple accounts by their IDs.
  rpc GetByIds(GetAccountByIdsRequest) returns (GetAllAccountsResponse);
  // Retrieves all accounts associated with a specific customer ID.
  rpc GetByCustomerId (GetAccountByCustomerIdRequest) returns (GetAllAccountsResponse);
  // Retrieves accounts created within a specific date range.
  rpc GetByDateRange (GetByDateRangeRequest) returns (GetAllAccountsResponse);
  // Creates a new bank account.
  rpc Add (AddAccountRequest) returns (AccountModel);
  // Updates an existing bank account.
  rpc Update (UpdateAccountRequest) returns (google.protobuf.Empty);
  // Deletes an account by its ID.
  rpc Delete (DeleteAccountRequest) returns (google.protobuf.Empty);
  // Bulk creates multiple bank accounts.
  rpc AddBulk (AddAccountBulkRequest) returns (google.protobuf.Empty);
  // Bulk updates multiple bank accounts.
  rpc UpdateBulk (UpdateAccountBulkRequest) returns (google.protobuf.Empty);
  // Bulk deletes multiple bank accounts.
  rpc DeleteBulk (DeleteAccountBulkRequest) returns (google.protobuf.Empty);
  // Gets the total count of bank accounts.
  rpc GetCount (google.protobuf.Empty) returns (CountResponse);
  // Gets the count of bank accounts filtered by their active status.
  rpc GetCountByStatus (GetAccountsByStatusRequest) returns (CountResponse);
  // Gets the count of bank accounts created within a specific date range.
  rpc GetCountByDateRange (GetByDateRangeRequest) returns (CountResponse);
  // Gets the count of bank accounts belonging to a specific customer.
  rpc GetCountByCustomerId (GetAccountByCustomerIdRequest) returns (CountResponse);
  // Gets the total balance aggregated across all bank accounts.
  rpc GetTotalBalance (google.protobuf.Empty) returns (TotalBalanceResponse);
  // Gets the total balance aggregated for a specific account type.
  rpc GetTotalBalanceByAccountType (GetTotalBalanceByAccountTypeRequest) returns (TotalBalanceResponse);
  // Gets the average balance of accounts, optionally filtered by type and status.
  rpc GetAvgBalance(GetAvgBalanceRequest) returns (TotalBalanceResponse);
  // Modifies the balance of an account (increment/decrement).
  rpc ChangeBalance(ChangeBalanceRequest) returns (AccountModel);
}

// Request to retrieve the average balance of accounts.
message GetAvgBalanceRequest {
  // Optional filter for the account type ID.
  google.protobuf.Int32Value account_type_id = 1;
  // Optional filter for the active status.
  google.protobuf.BoolValue is_active = 2;
}

// Request to retrieve the total balance for a specific account type.
message GetTotalBalanceByAccountTypeRequest {
  // The ID of the account type.
  int32 account_type_id = 1;
}

// Response containing the aggregated balance.
message TotalBalanceResponse {
  // The total balance value formatted as a string.
  string total_balance = 1;
}

// Data model representing a customer bank account.
message AccountModel {
  // Unique identifier for the account.
  int32 account_id = 1;
  // Optional ID of the customer who owns the account.
  optional int32 customer_id = 2;
  // Optional ID representing the type of the account.
  optional int32 type_id = 3;
  // International Bank Account Number (IBAN).
  string iban = 4;
  // Current balance of the account represented as a string.
  optional string balance = 5;
  // Timestamp when the account was created.
  optional google.protobuf.Timestamp created_at = 6;
  // Status flag indicating whether the account is active.
  optional bool is_active = 7;
}

// Request to retrieve accounts by a customer ID.
message GetAccountByCustomerIdRequest {
  // The unique ID of the customer.
  int32 customer_id = 1;
}

// Response containing a list of bank accounts.
message GetAllAccountsResponse {
  // List of accounts.
  repeated AccountModel accounts = 1;
}

// Request to retrieve multiple accounts by their IDs.
message GetAccountByIdsRequest {
  // List of account IDs.
  repeated int32 account_ids = 1;
}

// Request to retrieve an account by its unique ID.
message GetAccountByIdRequest {
  // The unique ID of the account.
  int32 account_id = 1;
}

// Request to add a new account.
message AddAccountRequest {
  // Optional customer ID associated with the account.
  optional int32 customer_id = 1;
  // Optional account type ID.
  optional int32 type_id = 2;
  // IBAN of the new account.
  string iban = 3;
  // Initial balance of the account represented as a string.
  optional string balance = 4;
  // Active status of the new account.
  optional bool is_active = 5;
}

// Request to bulk add multiple new accounts.
message AddAccountBulkRequest {
  // List of accounts to add.
  repeated AddAccountRequest accounts = 1;
}

// Request to update an existing account.
message UpdateAccountRequest {
  // The unique ID of the account to update.
  int32 account_id = 1;
  // Optional customer ID to associate.
  optional int32 customer_id = 2;
  // Optional account type ID to associate.
  optional int32 type_id = 3;
  // IBAN of the account.
  string iban = 4;
  // Balance of the account represented as a string.
  optional string balance = 5;
  // Active status of the account.
  optional bool is_active = 6;
}

// Request to delete an account.
message DeleteAccountRequest {
  // The unique ID of the account to delete.
  int32 account_id = 1;
}

// Request to bulk update multiple accounts.
message UpdateAccountBulkRequest {
  // List of account update payloads.
  repeated UpdateAccountRequest accounts = 1;
}

// Request to bulk delete multiple accounts.
message DeleteAccountBulkRequest {
  // List of account deletion payloads.
  repeated DeleteAccountRequest accounts = 1;
}

// Request to count accounts filtered by status.
message GetAccountsByStatusRequest {
  // Active status to filter by.
  bool status = 1;
}

// Request to change an account's balance.
message ChangeBalanceRequest {
  // If true, increments the balance; if false, decrements.
  bool increment = 1;
  // The amount to adjust the balance by, represented as a string.
  string amount = 2;
  // The unique ID of the account whose balance is being changed.
  int32 account_id = 3;
}
